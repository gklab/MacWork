# macwork defaults. Override any key in ~/.config/macwork/config.yaml
# or with MACWORK__SECTION__KEY=value environment variables (e.g. MACWORK__ENGINE__MAX_STEPS=20).

decider:
  # jev: TypeSafe System One — calibrated probabilities, which is what every threshold in this file is a
  #   cut-off on. local: any model the planner can reach (a local OpenAI-compatible server, Apple's
  #   on-device model, a cloud one) — no key, no network needed, and no calibration either, so it is
  #   trusted less on purpose. Anything else plugs in through the macwork.deciders entry point.
  local:
    confidence_ceiling: 0.8      # the most any answer from a text model may claim. release_threshold is
                                 # 0.9, so with this ceiling nothing it says can release a flagged action
  kind: auto                # auto | jev | local | any name registered under the macwork.deciders entry point
  auto_order: [jev, local]  # "auto": the first of these this Mac can actually reach. Not a tie — see above:
                            # a fallback that needs a config edit first is a manual recovery, not a fallback
  model: jev-latest         # or jev-preview
  timeout_s: 10
  max_retries: 3                 # connection hiccups (a local proxy restarting) are retried with backoff
  backoff_s: 0.5
  backoff_max_s: 4.0
  proxy: system                  # system (follow the Mac's settings) | none (direct) | http://host:port
  usd_per_mtok: 0.042       # only for the cost log (the API reports tokens, not money)
  keychain_service: macwork   # key comes from TYPESAFE_API_KEY, else this Keychain item

watch:                      # `macwork watch`: run tasks when the Mac announces something
  file: ~/.config/macwork/triggers.yaml   # the rules — yours, not shipped: which apps and folders matter
                                          # is exactly the knowledge this project may not have in advance
  poll_s: 2.0               # the helper buffers events; this is how often they are collected
  clipboard_every_s: 1.0    # the pasteboard announces nothing, so it is the one source that is looked at

helper:
  mode: auto                # auto | socket | stdio
  socket: ~/Library/Application Support/macwork/helper.sock
  app: ~/Applications/MacWork Helper.app
  binary: null              # explicit path to a macwork-helper binary (stdio mode)
  start_timeout_s: 6

observe:
  # Providers turn the Mac into affordances, listed in this order (nothing is ranked by guessed relevance).
  providers: [window, sight, overlays, popups, windows, vision, menu, menubar_extras, sdef, schemes, services, keys,
              focus, typing, apps, shortcuts, files, clipboard, skills, readall, wheel, controls, drag]
              # focus before typing: "type at the cursor" is labelled with where the cursor turned out to be
              # drag last: it needs the frames
  ax:
    max_nodes: 3000
    max_depth: 40
    max_children: 300
    max_text: 200
    budget_ms: 3000
    visible_only: true
    manual_accessibility: auto   # auto | always | never — expose Electron/Chromium trees
    sparse_tree_below: 8         # "auto": retry with manual accessibility when fewer actionable nodes than this
                                 # (an *empty* tree is not retried: no window is not the same as a thin one)
    # Nodes kept from a list that is scrolled out of view — the rows *and* their contents, which are most
    # of them. Each costs an Accessibility round trip. Measured on a chat app: no limit 3030 ms / 188 rows,
    # 600 -> 1662 ms / 121, 400 -> 1133 ms / 96, 200 -> 660 ms / 71, 0 -> 171 ms / 46 (the visible ones).
    max_offscreen: 200
    window_skip_roles: [AXApplication, AXMenuBar]   # never descend into these from a window (menus have their own provider)
  menu:
    cache_s: 4                   # reuse the menu tree for the same app+window this long; any action invalidates it
    # The Apple menu used to be removed by position — hand-written knowledge of where macOS puts things,
    # which also took away "About This Mac", "System Settings…" and "Recent Items". Shutting down and logging
    # out are the safety floor's business, and the floor now classifies every action, so position is not the
    # place to decide this.
    skip_first_menu: false
    include_disabled: false
  overlays:                      # windows from other processes: prompts, alerts, notification banners
    elsewhere: true              # also the ones that overlap nothing — a banner in a corner never does, and
                                 # a task that is not told one arrived carries on into a dialog it cannot see
    max_elsewhere: 4             # each costs one Accessibility snapshot (~4 ms here); unreadable ones are free
    elsewhere_actions: true      # false: read what they say but do not offer their buttons as options
    read_by_sight: true          # a window that just appeared is read from the screen too, once: what its
                                 # tree cannot say (a widget's date, a drawn panel) the screen can
    text_chars: 1200             # how much of what such a window says goes to the decider. Was a literal 400:
                                 # Notification Center, dropped down by the menu bar clock, held the date past
                                 # the cut. Past this, the cut is said and the whole panel can be read at once
  window:
    # What can be done with an element is asked of the element (is this attribute settable? what does the app
    # call this action?), not decided by the role lists below. Those are kept as a second source, not dropped:
    # the Mac's "not settable" is not the last word, because the engine can click a row or focus a field and
    # type. Measured on a real screen: typing targets 3 -> 18 in an editor, 2 -> 9 in a chat app, while the
    # role lists still contributed 9 rows the attribute refused. false = role lists only, as before.
    by_capability: true
    action_labels:               # AX action -> how it is offered ("" = just the element)
                                 # an action that is not here is offered too, under the name the app gives it
                                 # (AXActionDescription), but only where nothing here already reaches the
                                 # element — AXScrollToVisible sits on 428 of 441 elements that all have AXPress
      AXPress: ""
      AXConfirm: ""
      AXPick: ""
      AXOpen: open
      AXShowMenu: open the context menu of
      AXIncrement: increase
      AXDecrement: decrease
      AXScrollDownByPage: scroll down
      AXScrollUpByPage: scroll up
    context_menu_roles: [AXRow, AXCell, AXImage, AXStaticText, AXList, AXOutline, AXTable, AXWebArea, AXTextArea, AXLink, AXGroup]   # buttons expose AXShowMenu everywhere; offer it where it means something
    text_roles: [AXTextField, AXTextArea, AXComboBox, AXSearchField, AXSecureTextField]
    select_roles: [AXRow]          # rows of lists, tables and outlines: offered as "select …", named by the text they show
    # whether Return submits is the one thing here the Mac does not answer: a one-line field and a document
    # are the same to it, so this stays a role list until a better signal turns up
    submit_roles: [AXTextField, AXComboBox, AXSearchField]   # single-line fields also get "type and press Return"
    range_roles: [AXTextArea]      # documents: select a part of the text, or put the cursor at the end
    read_roles: [AXStaticText, AXHeading, AXCell, AXLink]
    # Content, whose name is its identity: a row's place changes with every sort, a link's with every page.
    # Everything else — buttons, fields, tabs, toolbars — gets an identity from where it sits when the app
    # gives it no identifier, so a relabelled control (another language, another state) is the same control
    content_roles: [AXRow, AXCell, AXImage, AXStaticText, AXLink, AXHeading, AXList, AXOutline, AXTable, AXWebArea, AXGroup, AXMenuItem]
    field_chars: 300             # how much of a text field's contents is shown as evidence
    screen_text_chars: 1500
  windows:                       # the app's windows as the window server lists them, which needs no answer from
                                 # the app: what it has on screen when it does not answer Accessibility (starting,
                                 # or busy), and the windows on screen its tree does not describe when it does
    min_size: [100, 60]          # smaller is not one of its windows: the harness's own floor, set after it counted
                                 # toolbar strips, tooltips and unrealised panels at [0, 0, 100, 30] as windows
    read_by_sight: 0             # how many windows on screen that the tree of an answering app does not describe
                                 # are read off the screen, by their number, on each look; 0 lists them unread.
                                 # Stays 0 until a read-only survey of this Mac's apps has counted how many such
                                 # windows are ones nobody sees: each of those would cost a read per action
  apps:
    # launchservices: Spotlight finds the bundles, LaunchServices says which copy it would open for each
    #   bundle id — that copy is the one reported. Finds apps wherever they are (405 here against 146 by
    #   scanning, Finder and Safari among the missing) and collapses duplicates and build products.
    # dirs: scan the folders below and nothing else.
    source: launchservices
    timeout_s: 15                # how long Spotlight gets
    dirs: [/Applications, /System/Applications, /System/Applications/Utilities, ~/Applications]
    include_installed: true
  vision:
    mode: auto                   # auto: only when the AX tree is sparse or has unlabeled controls | always | never
    # Two ways a window can be out of the tree's reach, both needed. sparse_below: the tree is empty, known
    # before anything is read. canvas_min_texts: this many things were read that fall inside no element the
    # tree offered — the measured version, and the one that matters, because an editor with 477 actionable
    # nodes in its chrome and none in its editing area counted as "well described" under the count alone.
    sparse_below: 8              # fewer actionable AX elements than this = nothing to work with
    canvas_min_texts: 6
    max_empty_places: 12         # where read text lines up in rows and columns, this many empty crossings are offered as places too
    canvas_area_share: 0.35      # this much of a window holding nothing the tree named = read it now, not on request.
                                 # Measured two ways: a container this big with nothing named inside it, and the
                                 # window's area no described node covers at all (`undescribed_share`, computed for
                                 # every window: a spreadsheet's grid that is in the tree as nothing whatsoever)
    canvas_max_inside: 2         # …where "nothing" means at most this many described elements within it
    coverage_cells: 48           # cells a side the window is rasterised into for that share
    languages: auto              # auto = this Mac's languages, kept to the ones the recogniser supports
    language_correction: false   # it "corrects" towards those languages, and what is read is UI labels,
                                 # file names and code identifiers — where correction is most often wrong
    fast: false
    min_conf: 0.3
    near_radius: 60              # points: nearest text that may name an unlabeled control
    max_unlabeled: 40
    container_min_texts: 2       # an unlabeled container with this many texts in it offers each text as a click target
    max_container_targets: 40
    max_text_targets: 80
    # A window with no tree in it can still be pointed at. Clicking a particular text is one option per spot
    # (which one is the decision); these two are the same action wherever aimed, so they are one option each
    # with a slot — a canvas window's options would otherwise double against the budget that is already scarce.
    offer_right_click: true
    position_words: [top-left, top, top-right, left, center, right, bottom-left, bottom, bottom-right]
    describer_cmd: null          # optional local command that prints a short description of an image path (e.g. a local VLM)
  sdef:
    skip_suites: [Standard Suite, Text Suite, Type Definitions, Type Names Suite]
    skip_commands: []            # the standard suites above are the generic ones; risky commands meet the policy floor
    simple_types: [text, integer, real, number, boolean, file, "text|file"]
  # The physical keys — the one fixed list this engine is allowed, because these are not knowledge about any
  # app. App commands come from the app's own menus, or from the planner.
  keys: [return, escape, tab, space, delete, up, down, left, right, home, end, pageup, pagedown]
  sight:                         # one coarse look at the window with every observation (~30 ms, on-device, never sent):
                                 # before and after an action it says how much of the picture changed. It is the
                                 # only evidence there is in a window that draws itself (a game, a map, a canvas)
    enabled: true
    grid: 32                     # cells a side
    overlap: true                # taken on the helper's second connection while the tree is read on the first
    tolerance: 2                 # brightness levels (of 255) a cell may differ by and still be the same: the capture's
                                 # own noise floor, measured on an idle window — not a judgement about what matters
    timeout_s: 3
  controls:                      # input that lasts — keys and buttons held, the pointer moved by an amount — for
                                 # what is steered rather than operated (a game, a map, a 3D view). Nothing is
                                 # offered unless somebody declared it: the caller in `inputs.controls`, or you here
    enabled: true
    max_ms: 5000                 # the longest single hold offered. A budget: the decider acts again after it. The
                                 # helper has its own ceiling (10 s) whatever is asked
    apps: {}                     # <bundle id>: {<name>: {keys: [w], ms: [300, 1200]}, <name>: {move: {dx: -200}, ms: 150},
                                 #               <name>: {buttons: [left], ms: 100}}
  wheel:                         # the scroll wheel over the window being worked in: two options, no threshold
    enabled: true                # not gated on "is this a canvas" — see the provider on why that cannot be judged
    lines: 5                     # wheel lines, the unit a real wheel reports, so apps scroll their own distance
  focus:                         # where the keyboard goes: a system-wide question, not one app's tree
    enabled: true                # what the focused element *is*, never what it holds
    # the app holding the focus is the one that answers. Measured: 1 ms with Terminal in front, 1585 ms with
    # an Electron chat app — so it is capped, and an app that will not answer in time is simply not reported
    timeout_ms: 250
  typing:                        # type the caller's text wherever the cursor is (editors that expose no text field)
    enabled: true
    requires_input: text         # offered only when the caller supplied inputs.text
    # English, like every other string this repo writes. What the Mac says comes from the Mac and is in
    # whatever language it is set to; what *we* say is ours, and saying it twice in two chosen languages
    # only makes Chinese look special. Goals are the caller's own words, in any language they like.
    label: type the given text at the cursor, into whatever has keyboard focus
    submit_label: type the given text at the cursor and press Return
  shortcuts:                     # the person's own Shortcuts — also the only route by which an app's
                                 # declared App Intent can actually be performed (no process may perform
                                 # another app's intent; the system does, through Shortcuts and Siri)
    cache_s: 300
    output_chars: 4000           # what a shortcut returns comes back as a fact of the task
  menubar_extras:                # the status items at the right-hand end of the menu bar
    enabled: true
    owners_cache_s: 300          # how long the list of which processes own one is reused
    cache_s: 4                   # how long their trees are reused (any action invalidates them)
    max_apps: 20
    max_nodes: 60
    max_depth: 4
  clipboard:
    enabled: true
    preview_chars: 0             # 0 = report only the types and the size, never the contents
    requires_input: text         # "put it on the clipboard" is offered only when the caller supplied text
    label: put the given text on the clipboard
  readall:                       # "read everything this window says", for what does not fit on screen
    # A window whose tree holds only its chrome gives back the toolbar and the address bar. Measured on
    # Chrome: 41 nodes, all toolbar. Below either of these the read is reported as what it is, so the
    # decider is not told the document was read when the address bar was.
    thin_below_nodes: 25
    thin_below_chars: 400
    enabled: true
    offer_over: 200              # only offered when the screen text is long enough to be a summary
    chars: 40000
    max_nodes: 12000
    max_depth: 60
    max_children: 2000
    max_text: 4000
    budget_ms: 8000
    label: read all the text in this window, including what is scrolled out of sight
  services:                      # what other apps publish as Services (from their own Info.plist)
    enabled: true
    cache_s: 900                 # reading every bundle takes a moment; it runs behind the look
    limit: 80
  drag:
    enabled: true
    max_spots: 300
    label: drag one thing on screen onto another
  schemes:
    limit: 8                     # URL schemes offered per app (from its own Info.plist)
  files:                         # paths the caller named. Where one ends is asked of the file system —
                                 # the longest prefix that exists — so a name in any script is found, and
                                 # a language that attaches its particles without a space does not break it
    max_path_words: 6            # a filename may contain spaces; not many
    max_path_trim: 40            # how much of the sentence after a path to try trimming off
    limit: 15
    roots: ["~"]
    input_keys: [query, keywords, file]   # inputs that trigger a Spotlight search
    measure_bytes: 200000        # a named file up to this size is measured (lines, how it ends) so its options can state facts
    openers: 4                           # besides the default one, how many apps the system says can open a file are offered

planner:
  kind: auto                     # auto | none | foundation | anthropic | any name under endpoints (deepseek, local, …)
  auto_order: [foundation, local, deepseek, anthropic]   # on-device first; the first available one is used
  when: auto                     # auto: consult when the decider calls for a different route, a second opinion, or text | always: plan first | never
  warm_on_task_start: true       # wake a local planner in the background when a task starts (weights get paged out when idle)
  context_chars: 600
  context_actions: 40           # labels the planner sees (window first, then menus). Each one is prompt it must read
                                 # before it can answer: 400 labels meant ~5000 tokens and ~40 s of prefill on a dense model
  context_skip_channels: [app, shortcut, file]   # not worth the planner's attention budget (running apps are listed separately)
  max_steps: 8                   # sub-goals per plan
  max_replans: 2
  max_corrections: 3             # replans after a step judged to have gone wrong are counted on their own
  second_opinion_on_done: true   # before a task ends `done` after acting, a different model reads the same screen
                                 # and says whether it agrees; a "no" sends the decider back with "done" off the
                                 # table. Real runs ended done with the Open dialog up, or 144 still on the display
  max_done_opinions: 2           # per run; past this the decider's own verdict stands
  fill_inputs: true              # let the planner write text a step needs instead of asking the caller
  trust_on_device: true          # on-device planners see unredacted text; cloud planners never do
  endpoints:                     # any OpenAI-compatible chat API
    deepseek:                    # DeepSeek official API (https://api-docs.deepseek.com)
      base_url: https://api.deepseek.com
      model: deepseek-flash      # or deepseek-v4-pro
      api_key_env: DEEPSEEK_API_KEY
      keychain_account: deepseek # `macwork key set deepseek`
      json_mode: true
      max_tokens: 2000
      timeout_s: 60
    local:                       # LM Studio / Ollama / mlx_lm.server on this Mac
      base_url: http://127.0.0.1:1234/v1
      model: ""                  # empty: the server's first model
      local: true
      stream: true               # read as written: the timeout is then on silence, not on length, a reply is not
                                 # waited out past its JSON, and a request given up on is stopped, not left running
      timeout_s: 45              # a dense 27B model needs ~15–25 s per plan; a cold one pages back in first
      max_tokens: 1500
      extra: {chat_template_kwargs: {enable_thinking: false}}   # plans, not reasoning transcripts (ignored by models without it)
  anthropic:
    model: claude-opus-5
    effort: medium
    max_tokens: 16000

skills:
  dir: ~/Library/Application Support/macwork/skills
  record: true                   # save successful multi-step tasks as replayable routines
  min_steps: 2
  max_offered: 20

learn:                           # `macwork learn <app>`: safe exploration ahead of time
  max_actions: 30
  budget_s: 180
  channels: [menu, window]
  judge_batch: 16                # the decider judges which actions only show/navigate, this many per request
  max_judged: 160
  safe_threshold: 0.8
  max_back_steps: 2              # after each explored action, the decider picks up to this many steps back
  max_unrestored: 2

appmodel:
  signature_window: true         # include the window title in a screen's identity. Titles are the app's own
                                 # words, so false makes a screen's identity fully language-independent at
                                 # the cost of telling two windows of one app apart
  dir: ~/Library/Application Support/macwork/apps
  persist: true
  sample: 12
  max_edges: 2000
  max_hints: 8

engine:
  max_retractions: 2        # a choice the task took back this many times from one exact screen is no longer
                            # offered from that screen. Once is told to the decider and still offered; twice is
                            # enough, because a System-1 model answers an unchanged state the same way again
  max_no_progress: 3        # this many steps in a row that got the task nowhere — could not be done, broke
                            # their promise, judged no progress, or only led back — and the actions in them are
                            # not offered again from where they were taken, the planner is asked for a route,
                            # and the decider is told. One rule where three counts were (the same action four
                            # times from one screen, leading back three times, three on an unchanged screen)
  max_pictures: 200         # how many distinct screens a task remembers the look of (about 1.4 KB each). A budget
  queue_wait_s: 900         # how long `do` waits its turn before giving up and saying so, rather than hanging
  revert:                   # putting back what a task changed (`macwork revert <task>`), newest first
    max_steps: 8            # how far back to go in one call
    require_user_idle_s: 5  # refuse while someone has been using the Mac: their keystrokes went into these
                            # same apps, and an undo would take those back instead
    on_failure: false       # true: a task that failed or was cancelled puts its own changes back before
                            # tidy runs (tidy closes the windows the undo command lives in). Off by default:
                            # reverting is an action too, and it is asked for rather than assumed
  max_steps: 12                  # per run: one do(), or one resume() after the caller answered
  budget_s: 90                   # per run too — the caller's thinking time is not the task's
  total_steps: 48                # over all of a task's runs together
  total_budget_s: 600            # working time summed over the runs; waiting for the caller does not count
  checkpoint: true               # a run that uses up its steps or seconds hands back `need_continue` rather
                                 # than failing, as long as the task is still getting somewhere. Raising
                                 # max_steps instead only means a task going wrong runs longer unnoticed
  max_decisions: 120             # decider requests one run may make (a step can need several)
  max_cost_usd: 0.5              # 0 = no ceiling
  max_options: 200               # Jev accepts at most 255 per choice
  history: 6
  locked_channels: [shortcut]    # what still works while the screen is locked (no UI needed)
  evidence:                      # what every question sees about the screen (not only the action's options)
    controls: 60
    label_chars: 60
    checked: 20
    fields: 12                   # text fields and what they contain
  verify_done: true              # a "done" judgement is checked with a stricter question (asked in the same request)
  tidy: auto                     # auto: after a task ends, close apps it opened that are no longer needed | off | defer (caller calls tidy)
  tidy_background: true         # return the result first, close apps right after (the next task waits for it)
  quit_wait_ms: 3000             # how long a polite quit may take before the app is assumed to be asking something
  carry_chars: 600               # what each app showed, carried along so a later step uses real values, not guesses
  result_chars: 800              # the last screen text kept in the result (so closing an app loses no answer)
  max_fruitless_rethinks: 2      # "rethink" twice with no new route from the planner: diagnose and stop
  min_steps_before_giving_up: 4  # …but not while the screen still offers things this task has never tried
  max_answer_tries: 2            # a goal asking for information keeps looking this many times before it gives up
  open_front_s: 6                # opening a file waits this long for the app that handles it to come to the front,
                                 # and a look waits this long for an app that is starting or busy to answer
  max_ready_waits: 6             # looks per run that may first wait for the app to answer (the ledger's ready_waits),
                                 # apart from the decider's own `max_waits`: a launch does not use up its "wait"
  ready_poll_ms: 200             # the pause between questions while waiting; a question to an app that does not
                                 # answer already takes the helper's 0.5 s messaging timeout
  service_front_s: 1.5           # a service that brings its app forward does it quickly, or it does not do it
  repeat_notice: 3               # the same action three times running is put in front of the decider as a fact
  interruptions:
    aside_tries: 2               # a prompt that will not go after this many dismissals is left for the user instead
  max_waits: 4                   # times per task the decider may choose to wait for a loading/busy app
  wait_s: 1.5
  fold_groups_over: 60           # a group larger than this (every installed app) is always one "look into" away
  floor_batch: 24                 # floor classifications carried along with a step's own request (Jev answers in parallel)
  floor_grace_s: 0.15            # …and the step waits no longer than this for them: a late verdict still serves the next step
  max_looks: 6                   # times per task the decider may open a folded group of options to read it
  top_k: 3                       # alternatives returned when the user must choose
  # Every number under `thresholds` is a probability cut-off, and every one of them is a *safety* choice:
  # they decide when the engine acts without asking. They are not to be tuned automatically against a
  # success rate — a suite gets greener by asking less. Everything else in this file is a performance choice
  # (how long to wait, how much to read, how much to cache) and may be tuned freely.
  thresholds:                    # probability cut-offs only; which move to make is the decider's own choice
    done: 0.8                    # "already done" before acting, and "sub-goal done"
    step_evidence: 0.6           # …and a sub-goal the planner gave evidence for advances only when the screen
                                 # is judged to show that evidence too: one number moved the plan on before
    done_veto: 0.35              # after acting, the stricter done check overrules only below this
    progress_bad: 0.2            # a step judged below this got the task nowhere: it counts toward the no-progress rule
                                 # (max_no_progress), and the planner is told the step went wrong. A judgement, not a
                                 # measurement: nothing is withheld on it alone
    risky_screen: 0.6
    backs_out: 0.8               # on a risky screen, an action judged to only back out goes ahead without asking
    wants_answer: 0.5            # the goal asks for information: the planner writes outputs.answer when done
    interruption_is_the_task: 0.6   # below this, a prompt that turned up is in the way of the goal, not part of it
    answer_stands: 0.6           # an answer no screen holds word for word is reported only if it follows from what was seen
    answer_answers: 0.5          # …and it counts as answering the goal only above this: "the date is not shown"
                                 # is reported, but does not turn a task that ran out into `done`
    text_stands: 0.75            # …and text to type is held to more: the same value rewritten, never a new one
    serves_goal: 0.35            # leaving the app worked in (another app, a Shortcut, the web) must serve the stated goal
    goal_calls_for: 0.3          # a floor-gated action the goal does not call for is dropped instead of asking the user
    keep_window: 0.5             # tidy: a window the task opened in an app already running stays when still needed
    alternative: 0.1             # an option the decider gave less than this is not a way the goal could be read:
                                 # "ask the user" with one option above it means the goal is unclear, not ambiguous
    keep_open: 0.5               # tidy: an app the task opened stays open when the decider judges it still needed…
    stays_running: 0.5           # …or the kind of app that keeps running in the background
  verify:
    timeout_ms: 2500             # ceiling; most steps return as soon as an event or a content change is seen
    readback_ms: 800             # how long a typed field is given to settle before it is judged to hold the wrong text
    settle_ms: 150
    poll_ms: 80                  # also watch the window's content (many SwiftUI apps post no notifications); 0 = events only
    quiet_ms: 300                # after something changed, wait until the window stays unchanged this long (settled)
    poll_nodes: 400
    fingerprint_reuse_ms: 300    # a fingerprint this recent, of the same app, is the baseline an action moves from
                                 # (the one the judge just took): a step took three, and two were of one screen
    speculate: true              # decide on the first calm screen and check it did not move while deciding (else look again)
    speculate_quiet_ms: 80
    speculate_timeout_ms: 800    # no change by then: decide anyway; a late change is caught by the same check
    max_redo: 1                  # per step: after one redo the moving screen is taken as it is
    done_settle_ms: 1200         # before a final "done": how long the window may still be changing
    ambient_probe_s: 0.15        # how long to watch a window to see whether it changes on its own
  mode: yield                    # yield: the Mac is the user's — wait while they type or move (default)
                                 # exclusive: the engine owns the Mac (eval runs, unattended use). "background"
                                 # and "foreground" are the old names for these two.
  yield_idle_s: 1.5              # the user counts as busy until their keyboard and mouse have been quiet this long
  yield_max_s: 60                # how long one step waits for them before the task gives up its turn
  tasks_ttl_s: 1800
  persist: true                  # keep tasks across restarts, so a pending one survives `macwork serve`
                                 # being restarted and tidying still knows what that task opened
  store: ~/Library/Application Support/macwork/tasks.db
  activate_wait_s: 1.5           # how long to wait for an app to come to the front before refusing to type
  start_in_front_app: true       # a task that names no app begins in the app in front (never the one running this
                                 # engine: then in none). false: it begins in none, and the apps provider offers what
                                 # the goal names. Eval runs set it false, so no task begins where the last one ended
  activate_settle_s: 0.3         # after it comes forward, before its key window has focus
  close_wait_s: 0.6              # tidy: after asking a window to close

input:
  non_ascii: paste               # paste (clipboard, restored after) | unicode (synthetic unicode key events)
                                 # paste puts the text on the general pasteboard for about 250 ms, where a
                                 # clipboard manager will see it; unicode does not, and some editors ignore
                                 # synthetic unicode events. Not switched by default until that is measured
  set_value_first: false         # true: set a field's value through Accessibility first (background-friendly, but many fields ignore it)
  focus_by_click: true           # single-line fields: click them before typing (some apps ignore AX focus)
  focus_wait_s: 0.8              # how long to wait for the field to really have the keyboard before typing
  submit_wait_s: 0.8             # …and for the typed text to be in it before Return is sent
  handback_ms: 1000              # when the helper had to select an ASCII keyboard layout to type, how long after the
                                 # last key it may keep it while the focused element does not yet show the keys,
                                 # before the person's own input source goes back. A ceiling: they show within tens
                                 # of ms. Given back at once, an app still 1-4 keys behind the 6 ms-a-key stream read
                                 # the last of them through the input method, and 21 of 265 typing steps on
                                 # 09-20..23 left the end of the text composing. Sent to input.type by act._type
  handback_quiet_ms: 250         # …and how long for a focused element that shows no text, or whose text changed and
                                 # then stopped changing without ever showing the keys (the app rewrote them): about
                                 # ten times the longest backlog measured at hand-back, 4 keys at 6 ms

grants:                          # standing grants: a confirmation the person chose to have remembered, for one
                                 # action in one app (`macwork grants` lists them, `… revoke` takes one back).
                                 # The engine never adds one by itself, and nothing else makes it more permissive
  enabled: true
  path: ~/Library/Application Support/macwork/grants.json
  never_for: [delete, send, pay, risky_screen]   # floor categories that ask every time whatever was said before.
                                 # risky_screen: the gate came from what the screen was asking, not from the
                                 # action — "OK" is a different act on every dialog
  from_mcp: false                # may an MCP caller pass remember=true? Off: a caller is usually a model, and a
                                 # standing permission is the person's to give — `macwork grants allow <task-id>`

audit:
  enabled: true
  path: ~/Library/Logs/macwork/audit.jsonl
  dry_run: false                 # true: never call the decider, only log what would be sent
  max_bytes: 67108864            # rotate past this (it holds redacted screen text; it is written 0600)
  keep: 3                        # audit.1.jsonl … audit.3.jsonl; the oldest falls off the end

server:
  name: macwork
  raw_observe: false             # true: mac_observe / mac_act hand the caller the screen text, field contents
                                 # and paths as they are. Off, they are redacted like a decider request — the
                                 # caller is a model somewhere else — and each answer is audited
  transport: stdio               # stdio | streamable-http
  host: 127.0.0.1
  port: 8977
