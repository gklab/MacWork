# What the engine may do on its own. Matching is on "<verb> <label> <context>" of an affordance.
#
# confirm.categories is the safety floor. EVERY action about to be run is classified by the decider from what
# it is and where it sits — never from screen text, so content on a page cannot talk it out of the floor. The
# words below do not decide anything: they are two languages wide (a German "Löschen" or a Japanese "削除"
# matches none of them), so a miss must never read as "safe". What they do is say which actions to classify
# first, and which categories to offer the classifier for them. They are also ambiguous on purpose — 下载 is
# both "download" and the Downloads folder, 替换 both "replace the file" and a text-replacement setting — which
# is exactly why the decider, not the pattern, gives the verdict.
# Only "it just opens, shows or navigates" at >= release_threshold releases a flagged action; anything else asks
# the user, or is dropped when the goal never called for it. Every release is written to the audit log.
# With no decider reachable at all, the words are the only fallback left, and that is logged too.
confirm:
  mode: caller              # caller: return need_confirm | never: act without asking (not recommended)
  # A cut-off on a *calibrated* probability, applied to BOTH paths — whether the word lists below happened
  # to recognise a word may change what the classifier is asked about, never how sure it has to be. It used
  # to apply only where the words hit, so the same unsure verdict released on a German or Japanese Mac and
  # stopped on an English one: the same language-dependence batch 2 removed, pointing the other way.
  #
  # A decider that reports itself uncalibrated can never reach this and is not measured against it (see
  # decider.local.confidence_ceiling). It is asked `floor_harmless` — a plain yes/no — instead. Be clear
  # about what that costs: on a Mac whose language these word lists do not cover, one answer from a text
  # model is the whole floor.
  release_threshold: 0.9              # when the word lists below flagged the action
  release_threshold_unflagged: 0.7    # when they did not. Lower, because 0.9 was calibrated for
                                      # releasing something already flagged as risky, and applying it
                                      # with no such evidence gated a calculator's Equals. Still a bar:
                                      # below it an action is gated however the classifier labelled it,
                                      # which is what makes a German "Löschen" at 0.34 stop.
  classify_step_level: true   # mac_act classifies the action too (one request the first time it sees one).
                              # false: the words alone, which is only as wide as the two languages below
  other: it does something else irreversible or outward-facing
  navigate: >-
    it only opens, shows, selects, plays or navigates to something (a folder, a page, a view, a setting, a list
    item, a song); nothing is deleted, sent, paid, installed, granted, agreed to, saved, run, quit or changed
  enter: >-
    it only enters text into a field or a document (a name, a search, a note); the text is not run as a command and
    nothing is sent or saved by typing it
  edit: >-
    it only changes what the app in front is working on and holds in its own window — text in a document or
    note, an entry in a calculator or a form, a selection, a value being edited — including clearing it,
    deleting part of it or undoing it. Nothing outside that window changes: no file, message, account, purchase
    or system setting is touched, nothing is saved, sent or installed, and doing it again or undoing it in the
    app would put things back
  back_out: >-
    it only closes, cancels, dismisses or goes back from what is on screen — a panel, a sheet, an alert, a
    menu, a tab — and commits nothing by doing so: no file, message, account, purchase or system setting is
    touched, nothing is saved, sent or installed, and nothing anyone typed is thrown away by it
  release: [navigate, enter, edit, back_out]   # the verdicts that let an action through; every other one asks the user
  # A verdict narrowed to the actions it can honestly apply to. Entries are verbs or channel:<name>, and an
  # action that is neither cannot be released by that verdict however sure the classifier is. "It only changes
  # what this window holds" is a judgement about prose; "this is the channel that moves files" is a fact about
  # the action — where a fact is available it is not the classifier's to overrule.
  release_only_for:
    enter: [type, type_submit]
    # `edit` covers a document, a calculator entry, a form. An entry here has to be a *fact* about what
    # the action can touch, and `channel:pointer` was not one: a click is a coordinate, the text OCR read
    # beside it may be wrong, and what is under it may be Send. It is gone.
    #
    # `channel:keys` is kept for a different reason, and only because of it: a combination now carries the
    # name of the app's own menu item with that key equivalent (`press cmd+s (文件 ▸ 存储…)`), so the words
    # and the classifier can both see what it does. Before that, `press cmd+s` was invisible to both.
    #
    # Left out, because they reach past the window by construction: file (including moving to the Trash),
    # app (quitting), script and script_cmd (running code), service (handing content to another app),
    # shortcut, clipboard.
    edit: [channel:window, channel:keys, channel:menu]
    # Getting out of the way of a dialog is what this is for, and only a control on that screen can do it.
    # Quitting an app, trashing a file or running a command are not "backing out", whatever they are called.
    back_out: [channel:window, channel:keys, channel:menu, channel:pointer]
  categories:
    delete:
      what: it deletes, erases, removes, trashes or discards something
      patterns: ['(?i)\b(delete|remove|erase|trash|discard)\b', '删除|移除|抹掉|废纸篓|丢弃|不存储|不保存']
    send:
      what: it sends, posts, publishes, shares or submits something to other people or a service
      patterns: ['(?i)\b(send|submit|post|publish|share)\b', '发送|提交|发布|分享']
    pay:
      what: it pays, buys, orders or transfers money
      patterns: ['(?i)\b(pay|purchase|buy|order|transfer)\b', '付款|支付|购买|下单|转账']
    account:
      what: it signs in, signs out, registers, creates an account or authorizes an app
      patterns: ['(?i)\b(log ?in|log ?out|sign ?in|sign ?out|sign ?up|register|create account|authorize|continue with (google|apple|microsoft|github))\b',
                 '登录|登入|退出登录|注销|注册|授权|创建账户']
    grant:
      what: it grants a permission or access to something
      patterns: ['(?i)(?<!don.t )(?<!not )\ballow\b', '(?<!不)允许']
    agree:
      what: it agrees to terms or accepts a licence or conditions
      patterns: ['(?i)\b(agree|accept)\b', '同意|接受']
    software:
      what: it installs, updates, upgrades or uninstalls software
      patterns: ['(?i)\b(install|update|upgrade|uninstall)\b', '安装|更新|升级|卸载']
    system:
      what: it quits an app, restarts, shuts down, logs out of the Mac or formats a disk
      patterns: ['(?i)\b(quit|shut ?down|restart|format)\b', '退出|关机|重新启动|重启|格式化']
    write:
      what: it saves, overwrites, replaces or exports a file
      patterns: ['(?i)\b(save|save as|overwrite|replace|replace all|export)\b', '保存|存储|存为|覆盖|替换|全部替换|导出']
    clipboard:
      what: it pastes whatever is on the clipboard
      patterns: ['(?i)\bpaste\b', '粘贴']
    execute:
      what: it runs a command, a script or program code (in a terminal, a console or through an app's scripting)
      patterns: ['(?i)\b(shell|script|scripting|terminal|command line|execute|eval|sudo)\b', '脚本|终端|命令行|执行']
  patterns: []              # extra floor patterns without a category ("irreversible or outward-facing")
  screen_gate_exempt: []      # channels that never touch the screen; every other one obeys a risky screen
deny:
  host_app: true            # never touch the app the caller runs in (the terminal or client this engine lives under)
  bundle_ids: []            # apps the engine must never touch
  patterns: []              # affordances it must never use (regex)
allow:
  bundle_ids: []            # empty = every app
  raw_applescript: false    # act(channel=script) with caller-supplied AppleScript
  sdef_commands: true       # commands an app declares in its scripting dictionary (values are passed as typed literals)
