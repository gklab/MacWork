[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macwork"
version = "0.1.0"
description = "Open-source computer-use agent and MCP server for macOS: operates any app through the Accessibility API and native interfaces instead of screenshots."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["macos", "computer-use", "ai-agent", "gui-automation", "desktop-automation", "accessibility",
            "accessibility-api", "mcp", "mcp-server", "model-context-protocol", "claude", "llm-agent", "typesafe", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typesafe-sdk>=0.7",
    "mcp>=2.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://macwork.org"
Repository = "https://github.com/gklab/MacWork"
Documentation = "https://github.com/gklab/MacWork/blob/main/docs/design-v4.md"
Issues = "https://github.com/gklab/MacWork/issues"

[project.scripts]
macwork = "macwork.cli:main"

# Third-party providers/channels/deciders plug in here without touching this package.
[project.entry-points."macwork.providers"]
[project.entry-points."macwork.channels"]
[project.entry-points."macwork.deciders"]

[tool.setuptools.packages.find]
include = ["macwork*"]

[tool.setuptools.package-data]
macwork = ["defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
